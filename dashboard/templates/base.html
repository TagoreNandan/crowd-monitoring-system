<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Crowd Monitoring Platform{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090b10;
      --card-bg: #131722;
      --card-border: #222938;
      --accent-blue: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --safe-bg: #064e3b; --safe-fg: #34d399;
      --caution-bg: #78350f; --caution-fg: #fbbf24;
      --warning-bg: #7c2d12; --warning-fg: #fb923c;
      --critical-bg: #7f1d1d; --critical-fg: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 24px;
      background: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }
    .brand { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; color: #ffffff; display: flex; align-items: center; gap: 10px; }
    .brand span { background: linear-gradient(135deg, #3b82f6, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    a { color: #60a5fa; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .grid img { width: 100%; border-radius: 8px; border: 1px solid var(--card-border); object-fit: cover; }
    .grid figcaption { font-size: 0.82rem; color: var(--text-muted); margin-top: 8px; text-align: center; font-weight: 500; }
    label { display: block; margin: 12px 0 6px; font-size: 0.85rem; font-weight: 600; color: #d1d5db; text-transform: uppercase; letter-spacing: 0.04em; }
    input[type=file], input[type=number], input[type=text], select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: #0d1117;
      color: var(--text-main);
      font-size: 0.95rem;
    }
    button {
      margin-top: 16px;
      padding: 12px 22px;
      border-radius: 8px;
      border: none;
      background: var(--accent-blue);
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.98); }
    .stat-pill {
      display: inline-flex;
      flex-direction: column;
      background: #0d1117;
      border: 1px solid var(--card-border);
      padding: 10px 16px;
      border-radius: 8px;
      margin: 4px 8px 8px 0;
      min-width: 120px;
    }
    .stat-pill .label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .stat-pill .value { font-size: 1.35rem; font-weight: 800; color: #ffffff; margin-top: 2px; }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }
    .SAFE { background: var(--safe-bg); color: var(--safe-fg); border: 1px solid #059669; }
    .CAUTION { background: var(--caution-bg); color: var(--caution-fg); border: 1px solid #d97706; }
    .WARNING { background: var(--warning-bg); color: var(--warning-fg); border: 1px solid #ea580c; }
    .CRITICAL { background: var(--critical-bg); color: var(--critical-fg); border: 1px solid #dc2626; }
    table { border-collapse: collapse; width: 100%; font-size: 0.88rem; margin-top: 12px; }
    td, th { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--card-border); }
    th { color: var(--text-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; }
    .error { color: #f87171; background: #450a0a; border: 1px solid #7f1d1d; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-weight: 500; }
    nav { margin-bottom: 20px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">👥 <span>CrowdVision AI</span> <small style="font-size:0.75rem; font-weight:500; color:var(--text-muted); margin-left:8px;">Enterprise Crowd Intelligence</small></div>
    <nav><a href="{{ url_for('index') }}">&larr; Back to Dashboard</a></nav>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
